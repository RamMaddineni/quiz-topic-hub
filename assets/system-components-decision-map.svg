<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Decision map for six system design components</title>
  <desc id="desc">Six cards connect an observed pressure to the mechanism, benefit, and hidden cost of load balancing, caching, partitioning, replication, message queues, and batch processing.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
    <style>
      .bg { fill: #f6faf9; }
      .title { fill: #14252b; font: 800 42px Inter, system-ui, sans-serif; letter-spacing: -1.2px; }
      .subtitle { fill: #607178; font: 500 21px Inter, system-ui, sans-serif; }
      .card { fill: #fff; stroke: #dce8e5; stroke-width: 2; filter: url(#shadow); }
      .name { fill: #14252b; font: 800 25px Inter, system-ui, sans-serif; }
      .label { fill: #6a7b81; font: 800 13px Inter, system-ui, sans-serif; letter-spacing: 1.4px; }
      .body { fill: #31444b; font: 600 17px Inter, system-ui, sans-serif; }
      .cost { fill: #8b3a18; font: 650 16px Inter, system-ui, sans-serif; }
      .arrow { fill: none; stroke: #97aaa6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .footer { fill: #087f73; font: 750 19px Inter, system-ui, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#97aaa6"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="980" rx="28"/>
  <text class="title" x="70" y="75">Six components. Six different pressures.</text>
  <text class="subtitle" x="70" y="112">Match the mechanism to the measured bottleneck—then name the new cost.</text>

  <!-- Load balancer -->
  <g transform="translate(70 155)">
    <rect class="card" width="510" height="230" rx="22"/>
    <rect x="0" y="0" width="10" height="230" rx="5" fill="#2563eb"/>
    <circle cx="55" cy="48" r="22" fill="#e8f0ff"/>
    <path d="M43 48h24M55 36v24M43 40l12 8 12-8M43 56l12-8 12 8" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <text class="name" x="92" y="56">Load balancer</text>
    <text class="label" x="35" y="95">PRESSURE</text>
    <text class="body" x="135" y="95">Uneven load; one backend can fail</text>
    <path class="arrow" marker-end="url(#arrowhead)" d="M35 116h440"/>
    <text class="label" x="35" y="146">MECHANISM</text>
    <text class="body" x="150" y="146">Choose a healthy backend per request</text>
    <text class="label" x="35" y="181">GAIN</text>
    <text class="body" x="90" y="181">Scale + failover; avoid overload latency</text>
    <text class="cost" x="35" y="211">Cost: health-check errors; the balancer also needs redundancy</text>
  </g>

  <!-- Cache -->
  <g transform="translate(620 155)">
    <rect class="card" width="510" height="230" rx="22"/>
    <rect x="0" y="0" width="10" height="230" rx="5" fill="#7c3aed"/>
    <circle cx="55" cy="48" r="22" fill="#f1eafe"/>
    <path d="M43 39h24v18H43zM47 35h16M47 61h16" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="name" x="92" y="56">Cache</text>
    <text class="label" x="35" y="95">PRESSURE</text>
    <text class="body" x="135" y="95">Repeated expensive reads or computation</text>
    <path class="arrow" marker-end="url(#arrowhead)" d="M35 116h440"/>
    <text class="label" x="35" y="146">MECHANISM</text>
    <text class="body" x="150" y="146">Reuse a recently fetched or computed value</text>
    <text class="label" x="35" y="181">GAIN</text>
    <text class="body" x="90" y="181">Lower latency and source load</text>
    <text class="cost" x="35" y="211">Cost: stale values, invalidation, misses, stampedes</text>
  </g>

  <!-- Partitioning -->
  <g transform="translate(70 420)">
    <rect class="card" width="510" height="230" rx="22"/>
    <rect x="0" y="0" width="10" height="230" rx="5" fill="#d97706"/>
    <circle cx="55" cy="48" r="22" fill="#fff3dc"/>
    <rect x="42" y="36" width="11" height="24" rx="2" fill="none" stroke="#d97706" stroke-width="3"/>
    <rect x="58" y="36" width="11" height="24" rx="2" fill="none" stroke="#d97706" stroke-width="3"/>
    <text class="name" x="92" y="56">Partitioning / sharding</text>
    <text class="label" x="35" y="95">PRESSURE</text>
    <text class="body" x="135" y="95">One database hits storage/write ceilings</text>
    <path class="arrow" marker-end="url(#arrowhead)" d="M35 116h440"/>
    <text class="label" x="35" y="146">MECHANISM</text>
    <text class="body" x="150" y="146">Split data ownership by a routing key</text>
    <text class="label" x="35" y="181">GAIN</text>
    <text class="body" x="90" y="181">Parallel capacity + data locality</text>
    <text class="cost" x="35" y="211">Cost: hot shards; fan-out and cross-shard transactions</text>
  </g>

  <!-- Replication -->
  <g transform="translate(620 420)">
    <rect class="card" width="510" height="230" rx="22"/>
    <rect x="0" y="0" width="10" height="230" rx="5" fill="#059669"/>
    <circle cx="55" cy="48" r="22" fill="#e1f8ef"/>
    <ellipse cx="50" cy="40" rx="10" ry="4" fill="none" stroke="#059669" stroke-width="2.5"/>
    <path d="M40 40v14c0 2 4 4 10 4s10-2 10-4V40M60 44h7v14M63 55l4 3 4-3" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="name" x="92" y="56">Replication</text>
    <text class="label" x="35" y="95">PRESSURE</text>
    <text class="body" x="135" y="95">Read load or a copy must survive failure</text>
    <path class="arrow" marker-end="url(#arrowhead)" d="M35 116h440"/>
    <text class="label" x="35" y="146">MECHANISM</text>
    <text class="body" x="150" y="146">Copy the same data to other nodes</text>
    <text class="label" x="35" y="181">GAIN</text>
    <text class="body" x="90" y="181">Read scale + failover</text>
    <text class="cost" x="35" y="211">Cost: replication lag, conflicts, write coordination</text>
  </g>

  <!-- Queue -->
  <g transform="translate(70 685)">
    <rect class="card" width="510" height="230" rx="22"/>
    <rect x="0" y="0" width="10" height="230" rx="5" fill="#dc2626"/>
    <circle cx="55" cy="48" r="22" fill="#fee9e7"/>
    <path d="M41 40h28v17H41zM46 45h18M46 51h18" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="name" x="92" y="56">Message queue</text>
    <text class="label" x="35" y="95">PRESSURE</text>
    <text class="body" x="135" y="95">Bursts or a slow downstream task</text>
    <path class="arrow" marker-end="url(#arrowhead)" d="M35 116h440"/>
    <text class="label" x="35" y="146">MECHANISM</text>
    <text class="body" x="150" y="146">Persist work between producer and consumer</text>
    <text class="label" x="35" y="181">GAIN</text>
    <text class="body" x="90" y="181">Decoupling + burst absorption</text>
    <text class="cost" x="35" y="211">Cost: backlog, duplicate delivery, delayed completion</text>
  </g>

  <!-- Batch -->
  <g transform="translate(620 685)">
    <rect class="card" width="510" height="230" rx="22"/>
    <rect x="0" y="0" width="10" height="230" rx="5" fill="#0891b2"/>
    <circle cx="55" cy="48" r="22" fill="#e1f7fb"/>
    <path d="M42 40h26v20H42zM47 35v10M63 35v10M42 47h26M49 52h3M58 52h3" fill="none" stroke="#0891b2" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="name" x="92" y="56">Batch processing</text>
    <text class="label" x="35" y="95">PRESSURE</text>
    <text class="body" x="135" y="95">Huge noninteractive work with a deadline</text>
    <path class="arrow" marker-end="url(#arrowhead)" d="M35 116h440"/>
    <text class="label" x="35" y="146">MECHANISM</text>
    <text class="body" x="150" y="146">Process many items together, often off-peak</text>
    <text class="label" x="35" y="181">GAIN</text>
    <text class="body" x="90" y="181">High throughput + efficient resource use</text>
    <text class="cost" x="35" y="211">Cost: each item waits; results are less fresh</text>
  </g>

  <text class="footer" x="600" y="956" text-anchor="middle">A component is justified only when its mechanism attacks your actual pressure.</text>
</svg>
